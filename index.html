<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Extrusion Plant — Monthly Performance Report</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1D21; --panel:#232629; --panel-2:#2A2E32; --panel-3:#1E2023;
    --line:#3A3F45; --line-soft:#2c2f33;
    --text:#E7E4DD; --text-dim:#9A9FA6; --text-dim2:#7C8187;
    --amber:#F0A202; --amber-dim:#7A5A14;
    --good:#4FAE7C; --bad:#D9534F; --info:#5B9BD5;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim2);}
  h1,h2,h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.5px;margin:0;font-weight:600;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:var(--amber);}

  header{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;border-bottom:2px solid var(--amber);background:linear-gradient(180deg,#202226,#1B1D21);}
  header .brand{display:flex;align-items:center;gap:14px;}
  header .brand .mark{width:36px;height:36px;border:2px solid var(--amber);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;color:var(--amber);font-size:13px;}
  header h1{font-size:18px;color:var(--text);}
  header .stamp{text-align:right;}
  header .stamp .date{color:var(--amber);font-size:12px;}

  .layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 68px);}
  aside{border-right:1px solid var(--line);background:var(--panel-3);padding:18px;}
  aside h2{font-size:12px;color:var(--text-dim2);margin-bottom:12px;}
  .plant-card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--radius);padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.15s;}
  .plant-card:hover{background:var(--panel-2);}
  .plant-card.active{border-left-color:var(--amber);background:var(--panel-2);}
  .plant-card .pname{font-family:'Oswald';font-size:14px;}
  .plant-card .psub{font-size:10.5px;color:var(--text-dim2);margin-top:3px;font-family:'JetBrains Mono';}
  .add-btn{width:100%;padding:9px;background:transparent;border:1px dashed var(--line);color:var(--text-dim2);border-radius:var(--radius);cursor:pointer;font-family:'JetBrains Mono';font-size:11.5px;letter-spacing:1px;text-transform:uppercase;margin-top:5px;}
  .add-btn:hover{border-color:var(--amber);color:var(--amber);}

  main{padding:22px 30px 60px;overflow-x:auto;}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;color:var(--text-dim2);text-align:center;gap:8px;}

  .workspace-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .workspace-head h1{font-size:23px;}
  .sub-line{font-size:11.5px;color:var(--text-dim2);margin-top:4px;font-family:'JetBrains Mono';}

  .tabs{display:flex;gap:2px;}
  .tab-btn{background:var(--panel);border:1px solid var(--line);color:var(--text-dim2);padding:8px 15px;font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;cursor:pointer;}
  .tab-btn.active{background:var(--amber);color:#1B1D21;border-color:var(--amber);font-weight:700;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
  .panel-title{font-size:12px;letter-spacing:1.3px;color:var(--text-dim2);text-transform:uppercase;font-family:'JetBrains Mono';margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}

  .grid-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim2);font-family:'JetBrains Mono';}
  .field input,.field select,.field textarea{background:#181A1D;border:1px solid var(--line);color:var(--text);padding:8px 9px;border-radius:var(--radius);font-family:'JetBrains Mono';font-size:12.5px;width:140px;}
  .field textarea{width:260px;min-height:36px;font-family:'Inter';resize:vertical;}
  .field.wide input, .field.wide select{width:200px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber);}

  .btn{background:var(--amber);color:#1B1D21;border:none;padding:9px 18px;font-family:'Oswald';font-weight:600;letter-spacing:0.5px;text-transform:uppercase;border-radius:var(--radius);cursor:pointer;font-size:12.5px;white-space:nowrap;}
  .btn:hover{background:#ffb521;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text-dim);}
  .btn.ghost:hover{border-color:var(--bad);color:var(--bad);}
  .btn.small{padding:6px 12px;font-size:10.5px;}
  .btn.add-row{background:var(--panel-2);color:var(--amber);border:1px dashed var(--amber-dim);}
  .btn.add-row:hover{background:#31353a;}

  table{width:100%;border-collapse:collapse;font-family:'JetBrains Mono';font-size:12px;}
  th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);color:var(--text-dim2);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;}
  td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  tr:hover td{background:#26292d;}
  td.num{text-align:right;}
  .del-btn{background:none;border:none;color:var(--text-dim2);cursor:pointer;font-size:13px;}
  .del-btn:hover{color:var(--bad);}
  .mini-table input,.mini-table select{width:100%;min-width:70px;padding:5px 6px;font-size:11px;}

  .badge{padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;white-space:nowrap;}
  .badge-good{background:rgba(79,174,124,.15);color:var(--good);}
  .badge-mid{background:rgba(240,162,2,.15);color:var(--amber);}
  .badge-bad{background:rgba(217,83,79,.15);color:var(--bad);}
  .badge-info{background:rgba(91,155,213,.15);color:var(--info);}
  .badge-dim{background:rgba(154,159,166,.15);color:var(--text-dim);}

  .sub-block{background:var(--panel-3);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:10px;}
  .sub-block-title{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim2);font-family:'JetBrains Mono';margin-bottom:8px;}
  .calc-note{font-size:11px;color:var(--text-dim2);font-family:'JetBrains Mono';margin-top:8px;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .stat-card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;}
  .stat-card .label{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-dim2);font-family:'JetBrains Mono';}
  .stat-card .value{font-family:'JetBrains Mono';font-size:24px;font-weight:700;margin-top:6px;}
  .stat-card .value.accent{color:var(--amber);}
  .stat-card .sub{font-size:10.5px;color:var(--text-dim2);margin-top:3px;}

  .bars{display:flex;align-items:flex-end;gap:3px;height:150px;border-bottom:1px solid var(--line);}
  .bar{flex:1;background:var(--amber-dim);border-radius:2px 2px 0 0;min-width:5px;}
  .bar.hit{background:var(--amber);}
  .bar-labels{display:flex;gap:3px;margin-top:5px;}
  .bar-labels span{flex:1;text-align:center;font-size:8.5px;color:var(--text-dim2);font-family:'JetBrains Mono';}
  .hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .hbar-label{width:120px;font-size:11px;font-family:'JetBrains Mono';color:var(--text-dim);flex-shrink:0;}
  .hbar-track{flex:1;background:var(--panel-3);border-radius:2px;height:16px;position:relative;overflow:hidden;}
  .hbar-fill{height:100%;background:var(--amber);border-radius:2px;}
  .hbar-val{width:70px;text-align:right;font-size:11px;font-family:'JetBrains Mono';color:var(--text);}

  .gauge-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  .gauge-card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;align-items:center;}
  .gauge-title{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim2);font-family:'JetBrains Mono';margin-bottom:8px;text-align:center;}
  .gauge-val{font-family:'JetBrains Mono';font-size:15px;font-weight:700;margin-top:-6px;}

  .month-picker{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .month-picker input,.month-picker select{background:#181A1D;border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:var(--radius);font-family:'JetBrains Mono';font-size:12.5px;}

  .section-num{color:var(--amber);font-family:'JetBrains Mono';margin-right:8px;}
  .no-data{color:var(--text-dim2);text-align:center;padding:30px;font-family:'JetBrains Mono';font-size:12.5px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;width:420px;max-height:85vh;overflow-y:auto;}
  .modal h3{margin-bottom:14px;font-size:15px;}
  .modal .field{margin-bottom:12px;width:100%;}
  .modal .field input,.modal .field select{width:100%;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;}
  .variant-chip{display:flex;justify-content:space-between;align-items:center;background:var(--panel-3);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;margin-bottom:6px;font-size:12px;font-family:'JetBrains Mono';}

  @media print{
    aside,header .stamp,.tabs,.btn,.del-btn,.month-picker .btn{display:none !important;}
    body{background:white;color:black;}
    .panel,.stat-card,.gauge-card{border-color:#ccc !important;background:white !important;}
  }
  @media (max-width:900px){
    .layout{grid-template-columns:1fr;}
    .stat-grid,.gauge-row{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">EX</div>
    <div>
      <div class="eyebrow">Extrusion Performance Monitoring</div>
      <h1>Monthly Production Report</h1>
    </div>
  </div>
  <div class="stamp">
    <div class="eyebrow">Shift Record</div>
    <div class="date mono" id="todayStamp"></div>
  </div>
</header>

<div class="layout">
  <aside>
    <h2 class="eyebrow">Facilities</h2>
    <div id="plantList"></div>
    <button class="add-btn" onclick="openAddPlant()">+ Add Facility</button>
    <button class="add-btn" onclick="loadDefaultStructure()" style="margin-top:8px;">⚡ Load Plant 1–4 Structure</button>
  </aside>
  <main id="mainArea"></main>
</div>

<div id="modalRoot"></div>

<script>
let plants = [];       // {id, name, shiftHours, variants:[{id,name,idealRate}], lines:[{id,name,type}]}
let shifts = {};       // plantId -> [{id,date,shiftLabel,lineId,variantId,rawMaterial,goodOutput,rejectedQty,plannedHours,downtimeHours,hourly:[],quality:[]}]
let dies = {};         // plantId -> [{id,dieId,lineId,installDate,status,removalDate,runningHours,throughputTons,reason,notes}]
const LINE_TYPES = ['Extruder','Pellet Mill','Crumbler'];
let activePlantId = null;
let activeTab = 'shift';
let loaded = false;
let draftHourly = [];
let draftQuality = [];

document.getElementById('todayStamp').textContent = new Date().toLocaleDateString(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric'}).toUpperCase();

async function loadAll(){
  try{ const r = await window.storage.get('plants'); plants = r ? JSON.parse(r.value) : []; }catch(e){ plants=[]; }
  shifts = {}; dies = {};
  for(const p of plants){
    try{ const r = await window.storage.get('shifts:'+p.id); shifts[p.id] = r ? JSON.parse(r.value) : []; }catch(e){ shifts[p.id]=[]; }
    try{ const r = await window.storage.get('dies:'+p.id); dies[p.id] = r ? JSON.parse(r.value) : []; }catch(e){ dies[p.id]=[]; }
  }
  if(plants.length && !activePlantId) activePlantId = plants[0].id;
  loaded = true;
  render();
}
async function savePlants(){ try{ await window.storage.set('plants', JSON.stringify(plants)); }catch(e){console.error(e);} }
async function saveShifts(pid){ try{ await window.storage.set('shifts:'+pid, JSON.stringify(shifts[pid]||[])); }catch(e){console.error(e);} }
async function saveDies(pid){ try{ await window.storage.set('dies:'+pid, JSON.stringify(dies[pid]||[])); }catch(e){console.error(e);} }

function uid(pre){ return (pre||'id')+'_'+Math.random().toString(36).slice(2,9); }
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function fmt(n,dec){ if(n==null||isNaN(n)) return '0'; return n.toLocaleString(undefined,{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}); }

/* ---------------- PLANT MANAGEMENT ---------------- */
function openAddPlant(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>New Facility</h3>
        <div class="field"><label>Facility Name</label><input id="np_name" placeholder="e.g. Extruder Line 2"></div>
        <div class="field"><label>Standard Shift Length (hours)</label><input id="np_shift" type="number" value="8"></div>
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">Cancel</button>
          <button class="btn" onclick="submitAddPlant()">Add Facility</button>
        </div>
      </div>
    </div>`;
}
async function submitAddPlant(){
  const name = document.getElementById('np_name').value.trim();
  const shiftHours = parseFloat(document.getElementById('np_shift').value) || 8;
  if(!name) return;
  const id = uid('plant');
  plants.push({id,name,shiftHours,variants:[],lines:[]});
  shifts[id]=[]; dies[id]=[];
  await savePlants(); await saveShifts(id); await saveDies(id);
  activePlantId = id; closeModal(); render();
}
async function loadDefaultStructure(){
  if(plants.length && !confirm('This adds Plant 1–4 with their lines to your current facility list. Continue?')) return;
  const spec = [
    {name:'Plant 1', lines:[{name:'Line 1',type:'Extruder'},{name:'Line 2',type:'Extruder'},{name:'Line 3',type:'Extruder'}]},
    {name:'Plant 2', lines:[{name:'Line 1',type:'Extruder'},{name:'Line 2',type:'Extruder'},{name:'Line 3',type:'Extruder'}]},
    {name:'Plant 3', lines:[{name:'Line 1',type:'Extruder'},{name:'Line 2',type:'Extruder'}]},
    {name:'Plant 4', lines:[{name:'Line 1',type:'Crumbler'},{name:'Line 2',type:'Pellet Mill'},{name:'Line 3',type:'Extruder'},{name:'Line 4',type:'Extruder'}]},
  ];
  for(const p of spec){
    const id = uid('plant');
    plants.push({id, name:p.name, shiftHours:8, variants:[], lines:p.lines.map(l=>({id:uid('line'), name:l.name, type:l.type}))});
    shifts[id]=[]; dies[id]=[];
    await saveShifts(id); await saveDies(id);
  }
  await savePlants();
  if(!activePlantId && plants.length) activePlantId = plants[0].id;
  render();
}
async function deletePlant(id, evt){
  evt.stopPropagation();
  if(!confirm('Remove this facility and all its logged data?')) return;
  plants = plants.filter(p=>p.id!==id);
  delete shifts[id]; delete dies[id];
  await savePlants();
  try{ await window.storage.delete('shifts:'+id); }catch(e){}
  try{ await window.storage.delete('dies:'+id); }catch(e){}
  if(activePlantId===id) activePlantId = plants.length ? plants[0].id : null;
  render();
}
function selectPlant(id){ activePlantId=id; activeTab='shift'; render(); }
function setTab(t){ activeTab=t; render(); }

/* ---------------- VARIANT MANAGEMENT ---------------- */
function openVariants(plantId){
  const plant = plants.find(p=>p.id===plantId);
  renderVariantModal(plant);
}
function renderVariantModal(plant){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>Manage Variants — ${esc(plant.name)}</h3>
        <div id="variantChips">${(plant.variants||[]).map(v=>`
          <div class="variant-chip">
            <span>${esc(v.name)} <span style="color:var(--text-dim2)">— ideal ${v.idealRate} t/hr</span></span>
            <button class="del-btn" onclick="removeVariant('${plant.id}','${v.id}')">✕</button>
          </div>`).join('') || '<div style="color:var(--text-dim2);font-size:12px;">No variants yet.</div>'}
        </div>
        <div class="field" style="width:100%;margin-top:14px;"><label>Variant Name</label><input id="v_name" placeholder="e.g. 3mm Fish Feed"></div>
        <div class="field" style="width:100%;"><label>Ideal Feedrate (ton/hr)</label><input id="v_rate" type="number" step="0.01" placeholder="e.g. 2.5"></div>
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">Done</button>
          <button class="btn" onclick="addVariant('${plant.id}')">Add Variant</button>
        </div>
      </div>
    </div>`;
}
async function addVariant(plantId){
  const name = document.getElementById('v_name').value.trim();
  const idealRate = parseFloat(document.getElementById('v_rate').value) || 0;
  if(!name) return;
  const plant = plants.find(p=>p.id===plantId);
  plant.variants = plant.variants || [];
  plant.variants.push({id:uid('var'), name, idealRate});
  await savePlants();
  renderVariantModal(plant);
  render();
}
async function removeVariant(plantId, variantId){
  const plant = plants.find(p=>p.id===plantId);
  plant.variants = plant.variants.filter(v=>v.id!==variantId);
  await savePlants();
  renderVariantModal(plant);
  render();
}

/* ---------------- LINE MANAGEMENT ---------------- */
function openLines(plantId){
  const plant = plants.find(p=>p.id===plantId);
  renderLineModal(plant);
}
function renderLineModal(plant){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>Manage Lines — ${esc(plant.name)}</h3>
        <div id="lineChips">${(plant.lines||[]).map(l=>`
          <div class="variant-chip">
            <span>${esc(l.name)} <span style="color:var(--text-dim2)">— ${esc(l.type)}</span></span>
            <button class="del-btn" onclick="removeLine('${plant.id}','${l.id}')">✕</button>
          </div>`).join('') || '<div style="color:var(--text-dim2);font-size:12px;">No lines yet.</div>'}
        </div>
        <div class="field" style="width:100%;margin-top:14px;"><label>Line Name</label><input id="l_name" placeholder="e.g. Line 1"></div>
        <div class="field" style="width:100%;"><label>Line Type</label>
          <select id="l_type">${LINE_TYPES.map(t=>`<option>${t}</option>`).join('')}</select>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">Done</button>
          <button class="btn" onclick="addLine('${plant.id}')">Add Line</button>
        </div>
      </div>
    </div>`;
}
async function addLine(plantId){
  const name = document.getElementById('l_name').value.trim();
  const type = document.getElementById('l_type').value;
  if(!name) return;
  const plant = plants.find(p=>p.id===plantId);
  plant.lines = plant.lines || [];
  plant.lines.push({id:uid('line'), name, type});
  await savePlants();
  renderLineModal(plant);
  render();
}
async function removeLine(plantId, lineId){
  const plant = plants.find(p=>p.id===plantId);
  plant.lines = plant.lines.filter(l=>l.id!==lineId);
  await savePlants();
  renderLineModal(plant);
  render();
}
function lineName(plant, id){ const l=(plant.lines||[]).find(l=>l.id===id); return l?l.name:'Unassigned'; }
function lineFull(plant, id){ const l=(plant.lines||[]).find(l=>l.id===id); return l?`${l.name} (${l.type})`:'Unassigned'; }

/* ---------------- METRICS ---------------- */
function shiftMetrics(shift, plant){
  const variant = (plant.variants||[]).find(v=>v.id===shift.variantId);
  const totalOutput = (shift.goodOutput||0) + (shift.rejectedQty||0); // kg
  const yieldPct = shift.rawMaterial>0 ? (totalOutput/shift.rawMaterial*100) : 0;
  const qualityRate = totalOutput>0 ? (shift.goodOutput/totalOutput*100) : 0;
  const runHours = Math.max(0,(shift.plannedHours||0)-(shift.downtimeHours||0));
  const availability = shift.plannedHours>0 ? (runHours/shift.plannedHours*100) : 0;

  let totalKwh=0, totalTon=0;
  (shift.hourly||[]).forEach(r=>{
    const power = Math.sqrt(3) * (r.voltage||0) * (r.current||0) * (r.pf||0.85) / 1000; // kW
    totalKwh += power; // 1 hour reading = kWh
    totalTon += (r.feedrate||0); // ton for that hour
  });
  const sme = totalTon>0 ? (totalKwh/totalTon) : 0; // kWh/ton
  const avgFeedrate = (shift.hourly||[]).length ? (totalTon/shift.hourly.length) : (runHours>0 ? (totalOutput/1000)/runHours : 0);
  const performance = (variant && variant.idealRate>0) ? (avgFeedrate/variant.idealRate*100) : 0;
  const oee = (availability/100)*(performance/100)*(qualityRate/100)*100;

  return {variant, totalOutput, yieldPct, qualityRate, runHours, availability, sme, avgFeedrate, performance, oee, totalKwh, totalTon};
}

function monthPrefix(){ return new Date().toISOString().slice(0,7); }

/* ---------------- RENDER: SHELL ---------------- */
function render(){ renderSidebar(); renderMain(); }

function renderSidebar(){
  const el = document.getElementById('plantList');
  if(!plants.length){ el.innerHTML = `<div style="font-size:12px;color:var(--text-dim2);font-family:'JetBrains Mono';">No facilities yet.</div>`; return; }
  const ym = monthPrefix();
  el.innerHTML = plants.map(p=>{

}

async function submitShift(plantId){
  const date = document.getElementById('s_date').value;
  const shiftLabel = document.getElementById('s_label').value;
  const lineId = document.getElementById('s_line').value;
  const variantId = document.getElementById('s_variant').value;
  const plannedHours = parseFloat(document.getElementById('s_planned').value)||0;
  const downtimeHours = parseFloat(document.getElementById('s_downtime').value)||0;
  const rawMaterial = parseFloat(document.getElementById('s_raw').value)||0;
  const goodOutput = parseFloat(document.getElementById('s_good').value)||0;
  const rejectedQty = parseFloat(document.getElementById('s_reject').value)||0;
  if(!date){ alert('Enter a date.'); return; }

  const hourly = draftHourly.filter(r=> r.current!=='' || r.voltage!=='' || r.feedrate!=='').map(r=>({hour:r.hour,current:parseFloat(r.current)||0,voltage:parseFloat(r.voltage)||0,pf:parseFloat(r.pf)||0.85,feedrate:parseFloat(r.feedrate)||0}));
  const quality = draftQuality.filter(q=>q.issue.trim()!=='');

  shifts[plantId] = shifts[plantId]||[];
  shifts[plantId].push({id:uid('shift'),date,shiftLabel,lineId,variantId,rawMaterial,goodOutput,rejectedQty,plannedHours,downtimeHours,hourly,quality});
  await saveShifts(plantId);
  const plant = plants.find(p=>p.id===plantId);
  resetDraft(plant);
  render();
}
async function deleteShift(plantId, shiftId){
  shifts[plantId] = (shifts[plantId]||[]).filter(s=>s.id!==shiftId);
  await saveShifts(plantId);
  render();
}

function buildReport(plantId, ym, lineFilter){
  lineFilter = lineFilter || 'all';
  const plant = plants.find(p=>p.id===plantId);
  const body = document.getElementById('reportBody');
  let list = (shifts[plantId]||[]).filter(s=>s.date.startsWith(ym));
  if(lineFilter!=='all') list = list.filter(s=>s.lineId===lineFilter);
  list = list.sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length){ body.innerHTML = `<div class="no-data">No shifts logged for ${monthLabel(ym)}${lineFilter!=='all' ? ' on '+esc(lineName(plant,lineFilter)) : ''}.</div>`; return; }

  const metrics = list.map(s=>({s, m:shiftMetrics(s, plant)}));

  // 1A. Yield analysis
  const totalRaw = list.reduce((a,s)=>a+(s.rawMaterial||0),0);
  const totalOut = metrics.reduce((a,x)=>a+x.m.totalOutput,0);
  const overallYield = totalRaw>0 ? (totalOut/totalRaw*100) : 0;

  // 1B. Raw material by variant
  const rawByVariant = groupSum(list, s=>variantName(plant,s.variantId), s=>s.rawMaterial||0);

  // 2A/2B output & feedrate by variant
  const outputByVariant = groupSum(list, s=>variantName(plant,s.variantId), s=>s.goodOutput||0);
  const feedrateByVariant = groupAvg(metrics, x=>variantName(plant,x.s.variantId), x=>x.m.avgFeedrate);

  // 2C/2D quality issues + corrective actions
  const allIssues = [];
  list.forEach(s=> (s.quality||[]).forEach(q=> allIssues.push({...q, date:s.date, shift:s.shiftLabel, line:lineName(plant,s.lineId), variant:variantName(plant,s.variantId)})));

  // 2E total rejections
  const totalRejected = list.reduce((a,s)=>a+(s.rejectedQty||0),0);
  const rejectByVariant = groupSum(list, s=>variantName(plant,s.variantId), s=>s.rejectedQty||0);

  // 3. Per-line equipment performance (Extruder/Pellet Mill/Crumbler)
  const linesInScope = lineFilter==='all' ? plant.lines : plant.lines.filter(l=>l.id===lineFilter);
  const linePerf = linesInScope.map(l=>{
    const lm = metrics.filter(x=>x.s.lineId===l.id);
    return {
      line:l,
      count:lm.length,
      availability: avg(lm.map(x=>x.m.availability)),
      performance: avg(lm.map(x=>x.m.performance)),
      quality: avg(lm.map(x=>x.m.qualityRate)),
      oee: avg(lm.map(x=>x.m.oee)),
      sme: avg(lm.filter(x=>x.m.sme>0).map(x=>x.m.sme)),
    };
  }).filter(lp=>lp.count>0);

  // Overall averages across the scoped shifts (for section headline)
  const avgAvailability = avg(metrics.map(x=>x.m.availability));
  const avgPerformance = avg(metrics.map(x=>x.m.performance));
  const avgQuality = avg(metrics.map(x=>x.m.qualityRate));
  const avgOee = avg(metrics.map(x=>x.m.oee));

  // Daily output chart (good output)
  const daysInMonth = new Date(parseInt(ym.slice(0,4)), parseInt(ym.slice(5,7)), 0).getDate();
  const dayTotals = {};
  list.forEach(s=>{ dayTotals[s.date] = (dayTotals[s.date]||0) + (s.goodOutput||0); });
  const maxDay = Math.max(...Object.values(dayTotals), 1);
  let bars='', labels='';
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${ym}-${String(d).padStart(2,'0')}`;
    const v = dayTotals[ds]||0;
    bars += `<div class="bar ${v>0?'hit':''}" style="height:${v>0?Math.max(4,(v/maxDay)*150):0}px" title="${ds}: ${fmt(v)} kg"></div>`;
    labels += (d%5===0||d===1) ? `<span>${d}</span>` : `<span></span>`;
  }

  // Die history for this plant (all-time, not month-filtered — infrequent events)
  let dieList = [...(dies[plantId]||[])];
  if(lineFilter!=='all') dieList = dieList.filter(d=>d.lineId===lineFilter);
  dieList = dieList.sort((a,b)=>a.installDate.localeCompare(b.installDate));
  const removedDies = dieList.filter(d=>d.status==='Removed' && d.runningHours>0);
  const avgLifeHours = removedDies.length ? avg(removedDies.map(d=>d.runningHours)) : 0;
  const avgLifeTons = removedDies.length ? avg(removedDies.map(d=>d.throughputTons)) : 0;

  body.innerHTML = `
    <div class="panel">
      <h3 style="font-size:16px;margin-bottom:14px;"><span class="section-num">1.</span>Batch Performance Summary</h3>
      <div class="panel-title">A. Batch Production Yield Analysis</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Total Raw Material</div><div class="value">${fmt(totalRaw)}</div><div class="sub">kg input</div></div>
        <div class="stat-card"><div class="label">Total Output</div><div class="value">${fmt(totalOut)}</div><div class="sub">kg (good + rejected)</div></div>
        <div class="stat-card"><div class="label">Overall Yield</div><div class="value accent">${overallYield.toFixed(1)}%</div><div class="sub">output ÷ raw material</div></div>
        <div class="stat-card"><div class="label">Shifts Logged</div><div class="value">${list.length}</div><div class="sub">${monthLabel(ym)}</div></div>
      </div>
      <div class="panel-title" style="margin-top:18px;">B. Raw Material Consumption by Variant</div>
      ${hbarTable(rawByVariant, 'kg')}
    </div>

    <div class="panel">
      <h3 style="font-size:16px;margin-bottom:14px;"><span class="section-num">2.</span>Finished Product Performance Review</h3>
      <div class="panel-title">A. Production Output by Variant (kg good output)</div>
      ${hbarTable(outputByVariant, 'kg')}
      <div class="panel-title" style="margin-top:18px;">B. Average Production Feedrate by Variant (ton/hr)</div>
      ${hbarTable(feedrateByVariant, 't/hr', true)}

      <div class="panel-title" style="margin-top:18px;">C. Quality Issues &amp; Root Cause Analysis</div>
      <table>
        <thead><tr><th>Date</th><th>Shift</th><th>Line</th><th>Variant</th><th>Issue</th><th class="num">Qty (kg)</th><th>Root Cause</th></tr></thead>
        <tbody>
          ${allIssues.length ? allIssues.map(q=>`<tr><td>${q.date}</td><td>${q.shift}</td><td>${esc(q.line)}</td><td>${esc(q.variant)}</td><td>${esc(q.issue)}</td><td class="num">${fmt(q.qty)}</td><td>${esc(q.rootCause)}</td></tr>`).join('') : `<tr><td colspan="7" class="no-data">No quality issues logged.</td></tr>`}
        </tbody>
      </table>

      <div class="panel-title" style="margin-top:18px;">D. Corrective Actions and Effectiveness</div>
      <table>
        <thead><tr><th>Date</th><th>Issue</th><th>Corrective Action</th><th>Effectiveness</th></tr></thead>
        <tbody>
          ${allIssues.length ? allIssues.map(q=>`<tr><td>${q.date}</td><td>${esc(q.issue)}</td><td>${esc(q.action)}</td><td>${effBadge(q.effectiveness)}</td></tr>`).join('') : `<tr><td colspan="4" class="no-data">No corrective actions logged.</td></tr>`}
        </tbody>
      </table>

      <div class="panel-title" style="margin-top:18px;">E. Total Finished Product Rejections</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Total Rejected</div><div class="value" style="color:var(--bad)">${fmt(totalRejected)}</div><div class="sub">kg this month</div></div>
        <div class="stat-card"><div class="label">Rejection Rate</div><div class="value">${totalOut>0?(totalRejected/totalOut*100).toFixed(1):'0'}%</div><div class="sub">of total output</div></div>
      </div>
      ${hbarTable(rejectByVariant, 'kg')}
    </div>

    <div class="panel">
      <h3 style="font-size:16px;margin-bottom:14px;"><span class="section-num">3.</span>Line Performance and Efficiency Analysis</h3>
      <div class="panel-title">Daily Good Output — All Scoped Lines</div>
      <div class="bars">${bars}</div>
      <div class="bar-labels">${labels}</div>
      ${linePerf.length ? linePerf.map(lp=>`
        <div class="sub-block" style="margin-top:18px;">
          <div class="sub-block-title" style="font-size:12px;color:var(--text);">${esc(lp.line.name)} — ${esc(lp.line.type)} <span style="color:var(--text-dim2);font-weight:normal;">(${lp.count} shifts)</span></div>
          <div class="panel-title" style="margin-top:6px;">A. Specific Mechanical Energy (SME)</div>
          <div class="stat-grid" style="grid-template-columns:repeat(1,220px);margin-bottom:10px;">
            <div class="stat-card"><div class="label">Avg SME</div><div class="value accent">${lp.sme>0?lp.sme.toFixed(2):'—'}</div><div class="sub">kWh / ton</div></div>
          </div>
          <div class="panel-title">B–E. Availability, Performance, Quality &amp; OEE</div>
          <div class="gauge-row" style="grid-template-columns:repeat(4,1fr);">
            ${gaugeCard('Availability', lp.availability)}
            ${gaugeCard('Performance', lp.performance)}
            ${gaugeCard('Quality Rate', lp.quality)}
            ${gaugeCard('OEE', lp.oee, true)}
          </div>
        </div>
      `).join('') : `<div class="no-data">No line data for this scope.</div>`}
    </div>

    <div class="panel">
      <h3 style="font-size:16px;margin-bottom:14px;"><span class="section-num">4.</span>Die Performance and Service Life Analysis</h3>
      <div class="stat-grid" style="margin-bottom:16px;">
        <div class="stat-card"><div class="label">Avg Service Life</div><div class="value accent">${avgLifeHours?fmt(avgLifeHours,1):'—'}</div><div class="sub">hours (removed dies)</div></div>
        <div class="stat-card"><div class="label">Avg Throughput Life</div><div class="value">${avgLifeTons?fmt(avgLifeTons,1):'—'}</div><div class="sub">tons before change</div></div>
        <div class="stat-card"><div class="label">Dies On Record</div><div class="value">${dieList.length}</div><div class="sub">all-time</div></div>
        <div class="stat-card"><div class="label">Currently Active</div><div class="value">${dieList.filter(d=>d.status==='Active').length}</div><div class="sub">in service</div></div>
      </div>
      <table>
        <thead><tr><th>Line</th><th>Die</th><th>Installed</th><th>Status</th><th>Removed</th><th class="num">Running Hrs</th><th class="num">Throughput (t)</th><th>Reason</th></tr></thead>
        <tbody>
          ${dieList.length ? dieList.map(d=>`<tr><td>${esc(lineName(plant,d.lineId))}</td><td>${esc(d.dieId)}</td><td>${d.installDate}</td><td>${d.status==='Active'?'<span class="badge badge-info">Active</span>':'<span class="badge badge-dim">Removed</span>'}</td><td>${d.removalDate||'—'}</td><td class="num">${d.runningHours?fmt(d.runningHours,1):'—'}</td><td class="num">${d.throughputTons?fmt(d.throughputTons,1):'—'}</td><td>${d.reason||'—'}</td></tr>`).join('') : `<tr><td colspan="8" class="no-data">No die records yet.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

function variantName(plant, id){ const v=(plant.variants||[]).find(v=>v.id===id); return v?v.name:'Unassigned'; }
function groupSum(list, keyFn, valFn){
  const map = {};
  list.forEach(item=>{ const k=keyFn(item); map[k]=(map[k]||0)+valFn(item); });
  return map;
}
function groupAvg(list, keyFn, valFn){
  const sums={}, counts={};
  list.forEach(item=>{ const k=keyFn(item); sums[k]=(sums[k]||0)+valFn(item); counts[k]=(counts[k]||0)+1; });
  const out={}; Object.keys(sums).forEach(k=> out[k]=sums[k]/counts[k]);
  return out;
}
function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }

function hbarTable(dataObj, unit, decimals){
  const entries = Object.entries(dataObj);
  if(!entries.length) return `<div class="no-data">No data available.</div>`;
  const max = Math.max(...entries.map(e=>e[1]), 0.0001);
  return entries.map(([k,v])=>`
    <div class="hbar-row">
      <div class="hbar-label">${esc(k)}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${(v/max*100).toFixed(1)}%"></div></div>
      <div class="hbar-val">${decimals?v.toFixed(2):fmt(v)} ${unit}</div>
    </div>`).join('');
}

function effBadge(eff){
  const cls = eff==='Effective' ? 'badge-good' : eff==='Partially Effective' ? 'badge-mid' : eff==='Not Effective' ? 'badge-bad' : 'badge-dim';
  return `<span class="badge ${cls}">${eff}</span>`;
}

function gaugeCard(title, value, big){
  const color = value>=85?'var(--good)':value>=60?'var(--amber)':'var(--bad)';
  return `<div class="gauge-card">
    <div class="gauge-title">${title}</div>
    ${gaugeSvg(Math.min(100,value), color)}
    <div class="gauge-val" style="color:${color}">${value.toFixed(1)}%</div>
  </div>`;
}
function gaugeSvg(pct, color){
  const r=60, cx=75, cy=75;
  const toXY=(ang)=>{ const rad=ang*Math.PI/180; return [cx+r*Math.cos(rad), cy-r*Math.sin(rad)]; };
  const [sx,sy]=toXY(180); const [ex,ey]=toXY(180-(pct/100)*180);
  const largeArc = pct>50?1:0;
  return `<svg viewBox="0 0 150 82" width="150" height="82">
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="#3A3F45" stroke-width="12" stroke-linecap="round"/>
    <path d="M ${sx} ${sy} A ${r} ${r} 0 ${largeArc} 1 ${ex} ${ey}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round"/>
  </svg>`;
}
function monthLabel(ym){ const [y,m]=ym.split('-'); return new Date(parseInt(y),parseInt(m)-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}).toUpperCase(); }

loadAll();
</script>
