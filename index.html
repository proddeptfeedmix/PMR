<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Feedmix Plant Ops</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#1B1D21; --panel:#232629; --panel-2:#2A2E32; --panel-3:#1E2023;
    --line:#3A3F45; --line-soft:#2c2f33;
    --text:#E7E4DD; --text-dim:#9A9FA6; --text-dim2:#7C8187;
    --amber:#F0A202; --amber-dim:#7A5A14;
    --good:#4FAE7C; --bad:#D9534F; --info:#5B9BD5; --teal:#3FA6A6;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim2);}
  h1,h2,h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.5px;margin:0;font-weight:600;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:var(--amber);}

  /* ---- Login ---- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#26292d,#1B1D21);}
  .login-card{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--amber);border-radius:var(--radius);padding:34px;width:340px;}
  .login-card h1{font-size:20px;margin-bottom:4px;}
  .login-card .field{width:100%;margin-bottom:14px;}
  .login-card .field input{width:100%;}
  .login-err{color:var(--bad);font-size:12px;font-family:'JetBrains Mono';margin-bottom:10px;min-height:14px;}

  header{display:flex;align-items:center;justify-content:space-between;padding:14px 26px;border-bottom:2px solid var(--amber);background:linear-gradient(180deg,#202226,#1B1D21);position:sticky;top:0;z-index:100;}
  header .brand{display:flex;align-items:center;gap:14px;}
  header .brand .mark{width:36px;height:36px;border:2px solid var(--amber);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;color:var(--amber);font-size:12px;}
  header h1{font-size:17px;color:var(--text);}
  header .userbox{display:flex;align-items:center;gap:12px;}
  .role-badge{padding:3px 10px;border-radius:10px;font-size:10.5px;font-family:'JetBrains Mono';letter-spacing:1px;text-transform:uppercase;font-weight:700;}
  .role-admin{background:rgba(240,162,2,.18);color:var(--amber);}
  .role-plant{background:rgba(91,155,213,.18);color:var(--info);}

  .layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 62px);}
  aside{border-right:1px solid var(--line);background:var(--panel-3);padding:16px;position:sticky;top:66px;height:calc(100vh - 66px);overflow-y:auto;z-index:30;}
  aside h2{font-size:11px;color:var(--text-dim2);margin-bottom:10px;}
  .plant-card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;cursor:pointer;}
  .plant-card:hover{background:var(--panel-2);}
  .plant-card.active{border-left-color:var(--amber);background:var(--panel-2);}
  .plant-card .pname{font-family:'Oswald';font-size:13.5px;}
  .add-btn{width:100%;padding:8px;background:transparent;border:1px dashed var(--line);color:var(--text-dim2);border-radius:var(--radius);cursor:pointer;font-family:'JetBrains Mono';font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-top:5px;}
  .add-btn:hover{border-color:var(--amber);color:var(--amber);}
  .admin-nav-btn{width:100%;padding:9px;background:var(--panel-2);border:1px solid var(--amber-dim);color:var(--amber);border-radius:var(--radius);cursor:pointer;font-family:'JetBrains Mono';font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;}
  .admin-nav-btn:hover{background:#31353a;}
  .logout-btn{background:none;border:1px solid var(--line);color:var(--text-dim);padding:6px 12px;border-radius:var(--radius);cursor:pointer;font-family:'JetBrains Mono';font-size:11px;}
  .logout-btn:hover{border-color:var(--bad);color:var(--bad);}

  main{padding:20px 28px 60px;}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;color:var(--text-dim2);text-align:center;gap:8px;}

  .workspace-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:18px;flex-wrap:wrap;gap:10px;position:sticky;top:66px;z-index:40;background:var(--bg);padding-top:14px;}
  .workspace-head h1{font-size:21px;}
  .sub-line{font-size:11px;color:var(--text-dim2);margin-top:4px;font-family:'JetBrains Mono';}

  .tabs{display:flex;gap:2px;flex-wrap:wrap;}
  .tab-btn{background:var(--panel);border:1px solid var(--line);color:var(--text-dim2);padding:7px 13px;font-family:'JetBrains Mono';font-size:10px;letter-spacing:1.1px;text-transform:uppercase;cursor:pointer;}
  .tab-btn.active{background:var(--amber);color:#1B1D21;border-color:var(--amber);font-weight:700;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .panel-title{font-size:11.5px;letter-spacing:1.2px;color:var(--text-dim2);text-transform:uppercase;font-family:'JetBrains Mono';margin-bottom:12px;}
  .group-title{font-size:10px;letter-spacing:1.2px;color:var(--amber);text-transform:uppercase;font-family:'JetBrains Mono';margin:14px 0 8px;border-bottom:1px solid var(--line-soft);padding-bottom:4px;}

  .field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px 16px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:9px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-dim2);font-family:'JetBrains Mono';white-space:normal;line-height:1.25;min-height:22px;display:block;}
  .field input,.field select{background:#181A1D;border:1px solid var(--line);color:var(--text);padding:7px 8px;border-radius:var(--radius);font-family:'JetBrains Mono';font-size:12px;width:100%;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--amber);}
  .grid-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .field.wide{grid-column:span 2;}

  .btn{background:var(--amber);color:#1B1D21;border:none;padding:9px 18px;font-family:'Oswald';font-weight:600;letter-spacing:0.5px;text-transform:uppercase;border-radius:var(--radius);cursor:pointer;font-size:12px;white-space:nowrap;}
  .btn:hover{background:#ffb521;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text-dim);}
  .btn.ghost:hover{border-color:var(--bad);color:var(--bad);}
  .btn.small{padding:6px 12px;font-size:10.5px;}

  table{width:100%;border-collapse:collapse;font-family:'JetBrains Mono';font-size:11.5px;}
  th,td{border:1px solid var(--line-soft);}
  th{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);background:var(--panel-2);color:var(--text-dim2);font-size:9px;letter-spacing:0.8px;text-transform:uppercase;}
  td{padding:7px 9px;vertical-align:top;}
  th.num,td.num{text-align:right;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover td{background:#282c30;}
  td.num{text-align:right;}
  .del-btn{background:none;border:none;color:var(--text-dim2);cursor:pointer;font-size:13px;}
  .del-btn:hover{color:var(--bad);}

  .badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap;}
  .badge-good{background:rgba(79,174,124,.15);color:var(--good);}
  .badge-teal{background:rgba(63,166,166,.18);color:var(--teal);}
  .badge-mid{background:rgba(240,162,2,.15);color:var(--amber);}
  .badge-bad{background:rgba(217,83,79,.15);color:var(--bad);}
  .badge-info{background:rgba(91,155,213,.15);color:var(--info);}
  .badge-dim{background:rgba(154,159,166,.15);color:var(--text-dim);}

  .sub-block{background:var(--panel-3);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:10px;}
  details.sub-block summary{list-style:revert;}
  details.sub-block summary::marker{color:var(--amber);}
  details.sub-block[open] summary{margin-bottom:4px;}
  .calc-note{font-size:10.5px;color:var(--text-dim2);font-family:'JetBrains Mono';margin-top:8px;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .stat-card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:13px;}
  .stat-card .label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim2);font-family:'JetBrains Mono';}
  .stat-card .value{font-family:'JetBrains Mono';font-size:22px;font-weight:700;margin-top:5px;}
  .stat-card .value.accent{color:var(--amber);}
  .stat-card .sub{font-size:10px;color:var(--text-dim2);margin-top:3px;}

  .gauge-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .gauge-card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;align-items:center;}
  .gauge-title{font-size:9px;letter-spacing:0.8px;text-transform:uppercase;color:var(--text-dim2);font-family:'JetBrains Mono';margin-bottom:6px;text-align:center;}
  .gauge-val{font-family:'JetBrains Mono';font-size:14px;font-weight:700;margin-top:-4px;}

  .hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
  .hbar-label{width:120px;font-size:11px;font-family:'JetBrains Mono';color:var(--text-dim);flex-shrink:0;}
  .hbar-track{flex:1;background:var(--panel-3);border-radius:2px;height:14px;overflow:hidden;}
  .hbar-fill{height:100%;background:var(--amber);border-radius:2px;}
  .hbar-val{width:80px;text-align:right;font-size:11px;font-family:'JetBrains Mono';color:var(--text);}

  .month-picker{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .month-picker input,.month-picker select{background:#181A1D;border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:var(--radius);font-family:'JetBrains Mono';font-size:12px;}

  .section-num{color:var(--amber);font-family:'JetBrains Mono';margin-right:6px;}
  .no-data{color:var(--text-dim2);text-align:center;padding:24px;font-family:'JetBrains Mono';font-size:12px;}
  .line-group{margin-bottom:18px;}
  .line-group:last-child{margin-bottom:0;}
  .line-group-header{display:flex;align-items:baseline;gap:10px;padding:8px 12px;background:var(--panel-3);border:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;}
  .line-group-header .lg-name{font-family:'Oswald';font-size:13px;letter-spacing:0.5px;color:var(--text);text-transform:uppercase;}
  .line-group-header .lg-type{font-family:'JetBrains Mono';font-size:9.5px;color:var(--text-dim2);text-transform:uppercase;letter-spacing:1px;}
  .line-group table{margin-top:-1px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;width:460px;max-height:86vh;overflow-y:auto;}
  .modal.wide{width:720px;}
  .modal h3{margin-bottom:12px;font-size:14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;}
  .chip{display:flex;justify-content:space-between;align-items:center;background:var(--panel-3);border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;margin-bottom:6px;font-size:11.5px;font-family:'JetBrains Mono';}

  .matrix-table{width:100%;border-collapse:collapse;font-size:11px;font-family:'JetBrains Mono';}
  .matrix-table th,.matrix-table td{border:1px solid var(--line);padding:5px;text-align:center;}
  .matrix-table th{background:var(--panel-3);color:var(--text-dim2);font-size:9.5px;}
  .matrix-table input{width:64px;background:#181A1D;border:1px solid var(--line);color:var(--text);padding:4px;border-radius:2px;font-family:'JetBrains Mono';font-size:11px;text-align:center;}

  .detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;font-size:11.5px;}
  .detail-item{background:var(--panel-3);border:1px solid var(--line-soft);border-radius:var(--radius);padding:7px 9px;}
  .detail-item .dl{font-size:8.5px;color:var(--text-dim2);text-transform:uppercase;letter-spacing:0.6px;font-family:'JetBrains Mono';}
  .detail-item .dv{font-family:'JetBrains Mono';font-size:13px;margin-top:2px;}

  @media print{
    aside,header .userbox,.tabs,.btn,.del-btn,.month-picker .btn{display:none !important;}
    body{background:white;color:black;}
    .panel,.stat-card,.gauge-card{border-color:#ccc !important;background:white !important;}
  }
  @media (max-width:900px){
    .layout{grid-template-columns:1fr;}
    .stat-grid,.gauge-row{grid-template-columns:repeat(2,1fr);}
    aside{position:static;height:auto;overflow-y:visible;}
    .workspace-head{position:static;}
  }
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="eyebrow">Feedmix Specialist Inc.</div>
    <h1>Plant Ops Login</h1>
    <div style="height:14px;"></div>
    <div class="field"><label style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim2);font-family:'JetBrains Mono';">Email</label><input id="loginEmail" type="email" placeholder="you@feedmix.local"></div>
    <div class="field"><label style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim2);font-family:'JetBrains Mono';">Password</label><input id="loginPassword" type="password" placeholder="••••••••"></div>
    <div class="login-err" id="loginErr"></div>
    <button class="btn" style="width:100%;" onclick="doLogin()">Log In</button>
  </div>
</div>

<div id="appRoot" style="display:none;">
  <header>
    <div class="brand">
      <div class="mark">FS</div>
      <div>
        <div class="eyebrow">Production Monitoring</div>
        <h1>Plant Ops</h1>
      </div>
    </div>
    <div class="userbox">
      <span class="role-badge" id="roleBadge"></span>
      <span class="mono" id="userEmailLabel" style="font-size:12px;color:var(--text-dim);"></span>
      <button class="logout-btn" onclick="doLogout()">Log Out</button>
    </div>
  </header>
  <div class="layout">
    <aside id="sidebar"></aside>
    <main id="mainArea"></main>
  </div>
</div>

<div id="modalRoot"></div>

<script>
/* =================== FIREBASE CONFIG =====================
   Replace with YOUR Firebase project config (Project Settings
   → General → Your apps → SDK setup and configuration).
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCvFCp33X18zRx7DWxZ-k2EVo_K8ItFuS8",
  authDomain: "productionr-2ca22.firebaseapp.com",
  projectId: "productionr-2ca22",
  storageBucket: "productionr-2ca22.firebasestorage.app",
  messagingSenderId: "550974432860",
  appId: "1:550974432860:web:a003243c7ae9042ee0e899"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const LINE_TYPES = ['Extruder','Pellet Mill','Crumbler'];
const DRYER_ZONES = 12;

let currentUser=null, currentRole=null, currentPlantId=null;
let plants = [];             // [{id,name,shiftHours,lines:[],variants:[],ict:{}}]
let shiftsCache = [];        // active plant's shifts
let diesCache = [];
let batchesCache = [];
let activePlantId = null;
let activeTab = 'shift';
let adminView = null;        // null | 'facilities' | 'users'
let mainRenderedKey = null;  // tracks what's currently painted in #mainArea so live data updates don't wipe in-progress form input
let logFilters = { shift:{month:'all',year:'all'}, batch:{month:'all',year:'all'}, die:{month:'all',year:'all'} };
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function filterByMonthYear(items, filterKey, dateField){
  const f = logFilters[filterKey];
  if(f.month==='all' && f.year==='all') return items;
  return items.filter(i=>{
    const d = dateField ? i[dateField] : i.date;
    if(!d) return true;
    const y = d.slice(0,4), m = d.slice(5,7);
    if(f.year!=='all' && y!==f.year) return false;
    if(f.month!=='all' && m!==f.month) return false;
    return true;
  });
}
function monthYearFilterControls(filterKey, items, dateField, refreshFn){
  const f = logFilters[filterKey];
  const dates = items.map(i=>(dateField?i[dateField]:i.date)).filter(Boolean);
  const years = [...new Set(dates.map(d=>d.slice(0,4)))].sort().reverse();
  return `
    <span class="eyebrow">Filter</span>
    <select onchange="logFilters.${filterKey}.month=this.value;${refreshFn}()">
      <option value="all" ${f.month==='all'?'selected':''}>All Months</option>
      ${MONTH_NAMES.map((mn,i)=>{const mm=String(i+1).padStart(2,'0'); return `<option value="${mm}" ${f.month===mm?'selected':''}>${mn}</option>`;}).join('')}
    </select>
    <select onchange="logFilters.${filterKey}.year=this.value;${refreshFn}()">
      <option value="all" ${f.year==='all'?'selected':''}>All Years</option>
      ${years.map(y=>`<option value="${y}" ${f.year===y?'selected':''}>${y}</option>`).join('')}
    </select>
    ${(f.month!=='all'||f.year!=='all') ? `<button class="btn ghost small" onclick="logFilters.${filterKey}={month:'all',year:'all'};${refreshFn}()">Clear</button>` : ''}`;
}
let lastShiftDate = todayLocalStr();
let lastShiftLabel = 'Day';
let plantsUnsub=null, shiftsUnsub=null, diesUnsub=null, batchesUnsub=null;
let draftQuality = [];
const QUALITY_ISSUE_OPTIONS = ['LOW FE','3 IN 1','2 IN 1','2 COLORS','HIGH TEMP','MOISTURE','TEXTURE','COMPACT','LENGTH/OVERSIZED','FINES'];
let draftEditQuality = []; // existing shift's quality issues being edited in Edit Parameters mode
let draftFollowUps = []; // new follow-up corrective actions being added in Edit mode (appended on save, never replaces history)
let userAccounts = [];       // roles collection cache (admin only)

/* ---------------- AUTH ---------------- */
function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPassword').value;
  document.getElementById('loginErr').textContent='';
  auth.signInWithEmailAndPassword(email, pw).catch(err=>{
    document.getElementById('loginErr').textContent = err.message;
  });
}
function doLogout(){ auth.signOut(); }

auth.onAuthStateChanged(async user=>{
  if(user){
    currentUser = user;
    let roleDoc;
    try{
      roleDoc = await db.collection('roles').doc(user.uid).get();
    }catch(err){
      document.getElementById('loginErr').textContent = 'Could not read your role (Firestore says: '+err.message+'). Check that the security rules were published, and that Firestore was created.';
      auth.signOut();
      return;
    }
    if(!roleDoc.exists){
      document.getElementById('loginErr').textContent = 'No role assigned to this account yet (UID: '+user.uid+'). Check that a document with this exact ID exists in the "roles" collection.';
      auth.signOut();
      return;
    }
    const data = roleDoc.data();
    currentRole = data.role;
    currentPlantId = data.plantId || null;
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appRoot').style.display='block';
    document.getElementById('roleBadge').textContent = currentRole==='admin' ? 'Admin' : 'Plant User';
    document.getElementById('roleBadge').className = 'role-badge ' + (currentRole==='admin' ? 'role-admin' : 'role-plant');
    document.getElementById('userEmailLabel').textContent = user.email;
    subscribePlants();
  } else {
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('appRoot').style.display='none';
    if(plantsUnsub) plantsUnsub();
    if(shiftsUnsub) shiftsUnsub();
    if(diesUnsub) diesUnsub();
    if(batchesUnsub) batchesUnsub();
    plants=[]; activePlantId=null; currentRole=null; currentPlantId=null;
  }
});

/* ---------------- FIRESTORE SUBSCRIPTIONS ---------------- */
function subscribePlants(){
  if(plantsUnsub) plantsUnsub();
  if(currentRole==='admin'){
    plantsUnsub = db.collection('plants').onSnapshot(snap=>{
      // Firestore does not guarantee document order without an explicit
      // orderBy(), so plants can otherwise come back in a seemingly random
      // order. Sort by name (numeric-aware, so "Plant 2" < "Plant 10").
      plants = snap.docs.map(d=>normalizePlant(d.id,d.data()))
        .sort((a,b)=>a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'}));
      if(!activePlantId && plants.length) activePlantId = plants[0].id;
      if(activePlantId) subscribePlantData(activePlantId);
      render();
    });
    db.collection('roles').onSnapshot(snap=>{
      userAccounts = snap.docs.map(d=>({uid:d.id,...d.data()}));
      if(adminView==='users') render();
    });
  } else {
    plantsUnsub = db.collection('plants').doc(currentPlantId).onSnapshot(doc=>{
      plants = doc.exists ? [normalizePlant(doc.id, doc.data())] : [];
      activePlantId = currentPlantId;
      subscribePlantData(activePlantId);
      render();
    });
  }
}
function normalizePlant(id, data){
  return {id, name:data.name||'Unnamed', shiftHours:data.shiftHours||8, lines:data.lines||[], variants:data.variants||[], ict:data.ict||{}, targetSme:data.targetSme||{}};
}
function subscribePlantData(plantId){
  if(shiftsUnsub) shiftsUnsub();
  if(diesUnsub) diesUnsub();
  if(batchesUnsub) batchesUnsub();
  shiftsUnsub = db.collection('plants').doc(plantId).collection('shifts').onSnapshot(snap=>{
    shiftsCache = snap.docs.map(d=>({id:d.id,...d.data()}));

function uid(pre){ return (pre||'id')+'_'+Math.random().toString(36).slice(2,9); }
/* Local-calendar-date helpers. IMPORTANT: never use Date#toISOString() for
   "today"/date-picker defaults — it converts to UTC first, which silently
   shifts the date by a day for any timezone ahead of UTC (e.g. Philippines,
   UTC+8) during roughly a third of every day. Always build date strings
   from local getters instead. */
function localDateStr(dt){
  const y = dt.getFullYear();
  const m = String(dt.getMonth()+1).padStart(2,'0');
  const d = String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function todayLocalStr(){ return localDateStr(new Date()); }
function currentMonthLocalStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function fmt(n,dec){ if(n==null||isNaN(n)) return '0'; return n.toLocaleString(undefined,{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}); }
function currentPlant(){ return plants.find(p=>p.id===activePlantId); }
function refreshDropdown(selectId, items){
  const el = document.getElementById(selectId);
  if(!el) return;
  const prev = el.value;
  const list = items||[];
  el.innerHTML = list.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('');
  if(list.some(i=>i.id===prev)) el.value = prev;
}

function getWeekRange(anchorDateStr){
  const d = new Date(anchorDateStr+'T00:00:00');
  const day = d.getDay();
  const diffToMonday = (day===0?-6:1-day);
  const monday = new Date(d); monday.setDate(d.getDate()+diffToMonday);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  return {start:localDateStr(monday), end:localDateStr(sunday)};
}

async function generateCompanyReport(){
  const body = document.getElementById('companyReportBody');
  if(!body) return;
  body.innerHTML = `<div class="no-data">Loading…</div>`;
  const typeEl = document.getElementById('cr_periodType');
  const type = typeEl ? typeEl.value : 'monthly';
  let start, end, label;
  if(type==='monthly'){
    const ym = document.getElementById('cr_month').value;
    start = ym+'-01';
    const daysInMonth = new Date(parseInt(ym.slice(0,4)),parseInt(ym.slice(5,7)),0).getDate();
    end = ym+'-'+String(daysInMonth).padStart(2,'0');
    label = monthLabel(ym);
  } else {
    const anchor = document.getElementById('cr_weekAnchor').value;
    const wr = getWeekRange(anchor);
    start = wr.start; end = wr.end;
    label = `Week of ${wr.start} to ${wr.end}`;
  }

  // Build per-plant structured data: plant -> lines -> variants
  const plantData = [];
  const companyIssueTally = {}; // issue text -> {bags, kg}
  for(const plant of plants){
    let shiftsSnap;
    try{ shiftsSnap = await db.collection('plants').doc(plant.id).collection('shifts').get(); }
    catch(e){ plantData.push({plant, lineGroups:[], totalFinishedProductBags:0, totalFinishedProductKg:0, totalRejectKg:0, avgOee:0, shiftCount:0}); continue; }
    const allShifts = shiftsSnap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.date>=start && s.date<=end);
    const metrics = allShifts.map(s=>({s,m:shiftMetrics(s,plant)}));
    allShifts.forEach(s=>(s.quality||[]).forEach(q=>{
      const key = (q.issue||'').trim();
      if(!key) return;
      if(!companyIssueTally[key]) companyIssueTally[key] = {bags:0, kg:0};
      companyIssueTally[key].bags += (q.qtyBags||0);
      companyIssueTally[key].kg += (q.qtyKg!=null?q.qtyKg:(q.qty||0));
    }));
    // NOTE: "Finished Product" here is defined as Excellent + Good + Project bags
    // (everything except Reject) — this is specific to the Company Report's Plant
    // Summary section, per an explicit request. Elsewhere in the app (Shift Log's
    // "Good Kg" column, per-plant Monthly Report), "good output" still means
    // Excellent + Good only, unchanged.
    const totalFinishedProductBags = metrics.reduce((a,x)=>a+(x.s.excellentBags||0)+(x.s.goodBags||0)+(x.s.projectBags||0),0);
    const totalFinishedProductKg = metrics.reduce((a,x)=>a+((x.s.excellentBags||0)+(x.s.goodBags||0)+(x.s.projectBags||0))*x.m.bagWeight,0);
    const totalRejectKg = metrics.reduce((a,x)=>a+x.m.rejectKg,0);
    const avgOeeAll = avg(metrics.map(x=>x.m.oee));

    const lineGroups = (plant.lines||[]).map(l=>{
      const lm = metrics.filter(x=>x.s.lineId===l.id);
      if(!lm.length) return null;
      const variantIdsUsed = [...new Set(lm.map(x=>x.s.variantId))];
      const variantRows = variantIdsUsed.map(vid=>{
        const vm = lm.filter(x=>x.s.variantId===vid);
        if(!vm.length) return null;
        const variant = variantObj(plant, vid);
        const targetSme = (plant.targetSme||{})[l.id+'_'+vid] || 0;
        const causeCounts = {};
        vm.forEach(x=> (x.s.quality||[]).forEach(q=>{
          const rc = (q.rootCause||'').trim();
          if(!rc) return;
          causeCounts[rc] = (causeCounts[rc]||0)+1;
        }));
        const topCauses = Object.entries(causeCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
        const finishedProductBags = vm.reduce((a,x)=>a+(x.s.excellentBags||0)+(x.s.goodBags||0)+(x.s.projectBags||0),0);
        const finishedProductKg = vm.reduce((a,x)=>a+((x.s.excellentBags||0)+(x.s.goodBags||0)+(x.s.projectBags||0))*x.m.bagWeight,0);
        return {
          variant, count:vm.length,
          finishedProductBags, finishedProductKg,
          rejectKg: vm.reduce((a,x)=>a+x.m.rejectKg,0),
          availability: avg(vm.map(x=>x.m.availability)),
          performance: avg(vm.map(x=>x.m.performance)),
          quality: avg(vm.map(x=>x.m.qualityRate)),
          oee: avg(vm.map(x=>x.m.oee)),
          sme: avg(vm.filter(x=>x.m.sme>0).map(x=>x.m.sme)),
          targetSme, topCauses
        };
      }).filter(Boolean);
      return {line:l, variantRows, count:lm.length};
    }).filter(Boolean);

    plantData.push({plant, lineGroups, totalFinishedProductBags, totalFinishedProductKg, totalRejectKg, avgOee:avgOeeAll, shiftCount:allShifts.length});
  }

  if(!body) return;

  const plantSummaryHtml = plantData.map(pd=>{
    const oc = oeeClass(pd.avgOee);
    return `<details class="sub-block" style="margin-top:12px;">
      <summary style="cursor:pointer;font-family:'JetBrains Mono';font-size:12px;color:var(--text);">
        ${esc(pd.plant.name)} <span style="color:var(--text-dim2);">— ${fmt(pd.totalFinishedProductBags)} bags / ${fmt(pd.totalFinishedProductKg)} kg finished product · ${fmt(pd.totalRejectKg)} kg reject · ${pd.shiftCount} shifts</span>
        ${pd.shiftCount?`<span class="badge ${oc.cls}" style="margin-left:8px;">${pd.avgOee.toFixed(1)}% OEE</span>`:'<span class="badge badge-dim" style="margin-left:8px;">No data</span>'}
      </summary>
      <div style="margin-top:12px;">
      ${pd.lineGroups.length ? pd.lineGroups.map(lg=>`
        <div style="margin-bottom:14px;">
          <div style="font-size:11.5px;color:var(--amber);font-family:'JetBrains Mono';margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;">${esc(lg.line.name)} — ${esc(lg.line.type)}</div>
          <table>
            <thead><tr><th>Variant</th><th class="num">Finished Product (bags)</th><th class="num">Finished Product (kg)</th><th class="num">Reject (kg)</th><th>Top Root Causes (occurrences)</th></tr></thead>
            <tbody>${lg.variantRows.map(vr=>`<tr>
              <td>${vr.variant?esc(vr.variant.name):'—'}</td>
              <td class="num">${fmt(vr.finishedProductBags)}</td>
              <td class="num">${fmt(vr.finishedProductKg)}</td>
              <td class="num">${fmt(vr.rejectKg)}</td>
              <td>${vr.topCauses.length? vr.topCauses.map(([c,n])=>`${esc(c)} (${n})`).join(', ') : '—'}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>`).join('') : `<div class="no-data">No shift data logged this period.</div>`}
      </div>
    </details>`;
  }).join('');

  const linePerfHtml = plantData.map(pd=>{
    const oc = oeeClass(pd.avgOee);
    return `<details class="sub-block" style="margin-top:12px;">
      <summary style="cursor:pointer;font-family:'JetBrains Mono';font-size:12px;color:var(--text);">
        ${esc(pd.plant.name)} ${pd.shiftCount?`<span class="badge ${oc.cls}" style="margin-left:8px;">${pd.avgOee.toFixed(1)}% OEE avg</span>`:'<span class="badge badge-dim" style="margin-left:8px;">No data</span>'}
      </summary>
      <div style="margin-top:12px;">

/* ---------------- METRICS ---------------- */
function oeeClass(oee){
  if(oee>=85) return {label:'World Class', cls:'badge-good'};
  if(oee>=70) return {label:'Good', cls:'badge-teal'};
  if(oee>=60) return {label:'Average', cls:'badge-mid'};
  return {label:'Bad', cls:'badge-bad'};
}
function shiftMetrics(s, plant){
  const variant = variantObj(plant, s.variantId);
  const bagWeight = variant ? (variant.bagWeight||0) : 0;

  const excellentBags = s.excellentBags||0;
  const goodBags = s.goodBags||0;
  const projectBags = s.projectBags||0;
  const rejectBags = s.rejectBags||0;
  const actualOutputBags = excellentBags + goodBags + projectBags + rejectBags;

  const goodOutputKg = (excellentBags + goodBags) * bagWeight; // sellable output: Excellent + Good only
  const totalOutputKg = actualOutputBags * bagWeight; // all 4 grades converted to kg
  const rejectKg = rejectBags * bagWeight;
  const qualityRate = actualOutputBags>0 ? (excellentBags/actualOutputBags*100) : 0; // Excellent ÷ Actual Output

  const isRequestOrder = s.orderDetails === 'Acc. to Request';
  const runHours = isRequestOrder ? (s.actualRunTime||0) : Math.max(0,(s.plannedHours||0)-(s.downtimeHours||0));
  const availability = isRequestOrder
    ? (s.plannedHours>0 ? (1 + ((s.plannedHours - (s.actualRunTime||0)) / s.plannedHours)) * 100 : 0)
    : (s.plannedHours>0 ? (runHours/s.plannedHours*100) : 0);

  const power = Math.sqrt(3) * (s.voltage||0) * (s.motorLoadAmp||0) * (s.powerFactor||0) * (s.efficiency||0) / 1000; // kW
  const sme = (s.feedrateTonHr>0) ? (power/s.feedrateTonHr) : 0; // kWh/ton

  const ictKey = (s.lineId||'')+'_'+(s.variantId||'');
  const ict = (plant.ict||{})[ictKey] || 0;
  const performance = (runHours>0) ? ((ict * actualOutputBags * bagWeight) / (runHours*3600) * 100) : 0;

  const oee = (availability/100)*(performance/100)*(qualityRate/100)*100;
  return {variant, bagWeight, excellentBags, goodBags, projectBags, rejectBags, actualOutputBags, goodOutputKg, totalOutputKg, rejectKg, qualityRate, runHours, availability, power, sme, ict, performance, oee};
}
function batchMetrics(b, plant){
  const variant = variantObj(plant, b.variantId);
  const bagWeight = variant ? (variant.bagWeight||0) : 0;
  // Backward compatible: records saved before "Fines Weight" existed keep their originally-entered Yield Weight.
  const yieldWeight = (b.finesWeight!=null) ? Math.max(0,(b.batchWeight||0)-(b.finesWeight||0)) : (b.yieldWeight||0);
  // Backward compatible: records saved before "Reject (bags)" existed keep their originally-entered kg value.
  const rejectKg = (b.rejectBags!=null) ? (b.rejectBags||0)*bagWeight : (b.reject||0);
  const yieldPct = b.batchWeight>0 ? (yieldWeight/b.batchWeight*100) : 0;
  const rejectPct = b.batchWeight>0 ? (rejectKg/b.batchWeight*100) : 0;
  const recoveryPct = b.batchWeight>0 ? ((b.finishedOutput||0)/b.batchWeight*100) : 0;
  return {yieldWeight, rejectKg, yieldPct, rejectPct, recoveryPct};
}
function monthPrefix(){ return currentMonthLocalStr(); }
function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
function groupSum(list, keyFn, valFn){ const m={}; list.forEach(i=>{const k=keyFn(i); m[k]=(m[k]||0)+valFn(i);}); return m; }
function groupAvg(list, keyFn, valFn){ const s={},c={}; list.forEach(i=>{const k=keyFn(i); s[k]=(s[k]||0)+valFn(i); c[k]=(c[k]||0)+1;}); const o={}; Object.keys(s).forEach(k=>o[k]=s[k]/c[k]); return o; }
function groupByLine(list, lines){
  // Groups records by line, newest-saved-first within each group (by createdAt).
  return (lines||[]).map(line=>{
    const items = list.filter(r=>r.lineId===line.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    return {line, items};
  });
}
function toggleQualityDetail(id, headerEl){
  const el = document.getElementById(id);
  if(!el) return;
  const showing = el.style.display !== 'none';
  el.style.display = showing ? 'none' : 'block';
  const caret = headerEl.querySelector('.qdetail-caret');
  if(caret) caret.style.transform = showing ? '' : 'rotate(90deg)';
}
function hbarTable(dataObj, unit, decimals){
  const entries = Object.entries(dataObj);
  if(!entries.length) return `<div class="no-data">No data available.</div>`;
  const max = Math.max(...entries.map(e=>e[1]), 0.0001);
  return entries.map(([k,v])=>`<div class="hbar-row"><div class="hbar-label">${esc(k)}</div><div class="hbar-track"><div class="hbar-fill" style="width:${(v/max*100).toFixed(1)}%"></div></div><div class="hbar-val">${decimals?v.toFixed(2):fmt(v)} ${unit}</div></div>`).join('');
}
function gaugeCard(title, value){
  const color = value>=85?'var(--good)':value>=60?'var(--amber)':'var(--bad)';
  return `<div class="gauge-card"><div class="gauge-title">${title}</div>${gaugeSvg(Math.min(100,Math.max(0,value)), color)}<div class="gauge-val" style="color:${color}">${value.toFixed(1)}%</div></div>`;
}
function gaugeSvg(pct, color){
  const r=54, cx=68, cy=68;
  const toXY=(ang)=>{const rad=ang*Math.PI/180; return [cx+r*Math.cos(rad), cy-r*Math.sin(rad)];};
  const [sx,sy]=toXY(180); const [ex,ey]=toXY(180-(pct/100)*180);
  // The filled arc's angular span is (pct/100)*180deg, which never exceeds
  // 180deg — so it is always the SVG "minor" arc. largeArcFlag must always
  // be 0 here; setting it to 1 above 50% (the old, buggy version) makes the
  // renderer draw the *other* way around the circle, which gets clipped by
  // the viewBox and shows up as a short broken stub instead of a full sweep.
  const largeArc = 0;
  return `<svg viewBox="0 0 136 74" width="136" height="74">
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="#3A3F45" stroke-width="11" stroke-linecap="round"/>
    <path d="M ${sx} ${sy} A ${r} ${r} 0 ${largeArc} 1 ${ex} ${ey}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round"/>
  </svg>`;
}
function monthLabel(ym){ const [y,m]=ym.split('-'); return new Date(parseInt(y),parseInt(m)-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}).toUpperCase(); }

// One-time backfill: older quality entries saved with qtyBags but no qtyKg get
// qtyKg filled from that shift's variant bag weight. Nothing else is touched;
// it only writes shifts that still have a gap, so it stops once filled.
let backfillInFlight = false;
async function backfillQualityKg(plantId){
  if(backfillInFlight) return;
  const plant = plants.find(p=>p.id===plantId);
  if(!plant) return;
  const toFix = shiftsCache.filter(s=>(s.quality||[]).some(q=>(q.qtyBags||0)>0 && q.qtyKg==null));
  if(!toFix.length) return;
  backfillInFlight = true;
  try{
    for(const s of toFix){
      const variant = variantObj(plant, s.variantId);
      const bagWeight = variant ? (variant.bagWeight||0) : 0;
      const fixedQuality = (s.quality||[]).map(q=>(q.qtyKg==null && (q.qtyBags||0)>0) ? {...q, qtyKg:(q.qtyBags||0)*bagWeight} : q);
      await db.collection('plants').doc(plantId).collection('shifts').doc(s.id).update({quality: fixedQuality});
    }
  } finally { backfillInFlight = false; }
}

function updatePlannedHoursFromRequest(){
  const plant = currentPlant();
  if(!plant) return;
  const orderType = document.getElementById('s_orderDetails')?.value;
  const qtyWrap = document.getElementById('qtyRequestedField');
  const runTimeWrap = document.getElementById('actualRunTimeField');
  const plannedEl = document.getElementById('s_planned');
  if(!plannedEl) return;
  if(orderType === 'Acc. to Request'){
    if(qtyWrap) qtyWrap.style.display='flex';
    if(runTimeWrap) runTimeWrap.style.display='flex';
    const lineId = document.getElementById('s_line')?.value;
    const variantId = document.getElementById('s_variant')?.value;
    const variant = variantObj(plant, variantId);
    const bagWeight = variant ? (variant.bagWeight||0) : 0;
    const ict = (plant.ict||{})[lineId+'_'+variantId] || 0;
    const qty = parseFloat(document.getElementById('s_qtyRequested')?.value)||0;
    const plannedHours = (ict>0 && bagWeight>0 && qty>0) ? ((qty*bagWeight) / ((1/ict)*3600)) : 0;
    plannedEl.value = plannedHours.toFixed(2);
    plannedEl.readOnly = true;
    plannedEl.style.opacity = '0.65';
    plannedEl.style.background = '#141618';
  } else {
    if(qtyWrap) qtyWrap.style.display='none';
    if(runTimeWrap) runTimeWrap.style.display='none';
    plannedEl.readOnly = false;
    plannedEl.style.opacity = '';
    plannedEl.style.background = '';
    if(!plannedEl.value || parseFloat(plannedEl.value)===0) plannedEl.value = plant.shiftHours;
  }
  if(document.getElementById('qualityRows')) renderQualityRows();
}

function updateEditPlannedHoursFromRequest(){

  const runTimeWrap = document.getElementById('edit_actualRunTimeField');

  if(!plannedEl) return;
  if(orderType === 'Acc. to Request'){

async function saveShiftEdit(plantId, shiftId){
  const g = id=>document.getElementById(id);
  const v = id=>{ const el=g(id); return el ? (parseFloat(el.value)||0) : 0; };
  const plant = currentPlant();
  const existingShift = shiftsCache.find(x=>x.id===shiftId);
  if(!existingShift){ alert('Could not find this shift — it may have been deleted.'); closeModal(); return; }

  const lineId = g('edit_lineId').value, variantId = g('edit_variantId').value;
  if(!lineId || !variantId || !lineObj(plant,lineId) || !variantObj(plant,variantId)){
    alert('Please select a valid Line and Variant.');
    return;
  }

  const dryer = {};
  for(let i=1;i<=DRYER_ZONES;i++) dryer['t'+i] = v('edit_dryer_t'+i);

  const orderDetails = g('edit_orderDetails').value;
  const newFollowUps = draftFollowUps.filter(f=>f.action.trim()!=='');
  const followUps = [...(existingShift.followUps||[]), ...newFollowUps];
  const quality = draftEditQuality.filter(q=>q.issue.trim()!=='').map(q=>({...q, qtyKg:(q.qtyBags||0)*variantObj(plant,variantId).bagWeight}));

  const updates = {
    date: g('edit_date').value,
    shiftLabel: g('edit_shiftLabel').value,
    lineId, variantId,
    recipeId: g('edit_recipeId').value,
    orderDetails,
    qtyRequested: orderDetails==='Acc. to Request' ? v('edit_qtyRequested') : 0,
    actualRunTime: orderDetails==='Acc. to Request' ? v('edit_actualRunTime') : 0,
    plannedHours: v('edit_plannedHours'),
    downtimeHours: v('edit_downtimeHours'),
    kgHr: v('edit_kgHr'),
    excellentBags: v('edit_excellentBags'), goodBags: v('edit_goodBags'), projectBags: v('edit_projectBags'), rejectBags: v('edit_rejectBags'),
    cylSteam:v('edit_cylSteam'), cylWater:v('edit_cylWater'), extSteam:v('edit_extSteam'), extWater:v('edit_extWater'),
    barrel1:v('edit_barrel1'), barrel2:v('edit_barrel2'), barrel3:v('edit_barrel3'),
    bedTop:v('edit_bedTop'), bedBottom:v('edit_bedBottom'),
    moisture:v('edit_moisture'), floatEff:v('edit_floatEff'), bulkDensity:v('edit_bulkDensity'),
    motorLoadAmp:v('edit_motorLoadAmp'), voltage:v('edit_voltage'), powerFactor:v('edit_powerFactor'), efficiency:v('edit_efficiency'), feedrateTonHr:v('edit_feedrateTonHr'),
    dryer, followUps, quality
  };
  await db.collection('plants').doc(plantId).collection('shifts').doc(shiftId).update(updates);
  draftFollowUps = [];
  draftEditQuality = [];
  closeModal();
}

  await db.collection('plants').doc(plantId).collection('batches').doc(batchId).update(updates);
  closeModal();
}

/* ---- Die helpers: backward compatible with old Active/Removed status + old throughputTons field ---- */
function dieIsActiveStatus(status){ return status==='Active' || status==='Still Active'; }
function dieIsRetiredStatus(status){ return status==='Removed' || status==='Worn Out'; }
function dieEntryThroughputTons(d){
  return (d.feedrateKgHr!=null) ? ((d.runningHours||0)*(d.feedrateKgHr||0)/1000) : (d.throughputTons||0);
}
function dieEntryDate(d){ return d.date || d.installDate || ''; }
function dieSummaries(list){
  const map = {};
  list.forEach(d=>{
    const key = (d.dieId||'').trim();
    if(!key) return;
    if(!map[key]) map[key] = {dieId:key, entries:[]};
    map[key].entries.push(d);
  });
  return Object.values(map).map(g=>{
    const sorted = [...g.entries].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const latest = sorted[0];
    const totalRunningHours = g.entries.reduce((a,d)=>a+(d.runningHours||0),0);
    const totalThroughputTons = g.entries.reduce((a,d)=>a+dieEntryThroughputTons(d),0);
    return {dieId:g.dieId, latest, entryCount:g.entries.length, totalRunningHours, totalThroughputTons, retired: latest?dieIsRetiredStatus(latest.status):false};
  }).sort((a,b)=>(b.latest&&b.latest.createdAt||0)-(a.latest&&a.latest.createdAt||0));
}

async function submitDie(plantId){
  const g = id=>document.getElementById(id);
  const plant = currentPlant();
  const dieId = g('d_id').value.trim();
  const date = g('d_date').value;
  if(!dieId || !date){ alert('Enter a die ID and date.'); return; }
  const lineId = g('d_line').value;
  if(!lineId || !lineObj(plant,lineId)){
    alert('The Line selected is no longer valid (it may have been renamed or removed). Please re-select it and try again.');
    mainRenderedKey = null; render();
    return;
  }
  const status = g('d_status').value;
  const record = {
    lineId, dieId, date, shiftLabel: g('d_shift').value, status,
    reason: status==='Worn Out'?g('d_reason').value:'',
    runningHours: parseFloat(g('d_hours').value)||0,
    feedrateKgHr: parseFloat(g('d_feedrate').value)||0,
    notes: g('d_notes').value,
    createdAt: Date.now()
  };
  await db.collection('plants').doc(plantId).collection('dies').add(record);
  mainRenderedKey = null;
  render();
}
async function deleteDie(plantId, dieRecId){
  await db.collection('plants').doc(plantId).collection('dies').doc(dieRecId).delete();
}

function buildReportFromControls(plantId){
  const type = document.getElementById('reportPeriodType')?.value || 'monthly';
  const periodValue = type==='monthly' ? document.getElementById('reportMonth').value : document.getElementById('reportWeekAnchor').value;
  const lineFilter = document.getElementById('reportLine').value;
  buildReport(plantId, type, periodValue, lineFilter);
}
function buildReport(plantId, periodType, periodValue, lineFilter){
  lineFilter = lineFilter || 'all';
  const plant = currentPlant();
  const body = document.getElementById('reportBody');

  let start, end, label, ym;
  if(periodType==='weekly'){
    const wr = getWeekRange(periodValue);
    start = wr.start; end = wr.end;
    label = `Week of ${wr.start} to ${wr.end}`;
    ym = null;
  } else {
    ym = periodValue;
    start = ym+'-01';
    const daysInMonthForRange = new Date(parseInt(ym.slice(0,4)),parseInt(ym.slice(5,7)),0).getDate();
    end = ym+'-'+String(daysInMonthForRange).padStart(2,'0');
    label = monthLabel(ym);
  }

  let shiftList = shiftsCache.filter(s=>s.date>=start && s.date<=end);
  let batchList = batchesCache.filter(b=>b.date>=start && b.date<=end);
  if(lineFilter!=='all'){ shiftList = shiftList.filter(s=>s.lineId===lineFilter); batchList = batchList.filter(b=>b.lineId===lineFilter); }
  shiftList.sort((a,b)=>a.date.localeCompare(b.date));

  if(!shiftList.length && !batchList.length){ body.innerHTML = `<div class="no-data">No data logged for ${esc(label)}${lineFilter!=='all'?' on '+esc(lineName(plant,lineFilter)):''}.</div>`; return; }

  const metrics = shiftList.map(s=>({s, m:shiftMetrics(s, plant)}));

  // Section 1 — batch based
  const totalBatchWeight = batchList.reduce((a,b)=>a+(b.batchWeight||0),0);
  const totalYieldWeight = batchList.reduce((a,b)=>a+batchMetrics(b, plant).yieldWeight,0);
  const overallYield = totalBatchWeight>0 ? (totalYieldWeight/totalBatchWeight*100) : 0;
  const rawByVariant = groupSum(batchList, b=>variantName(plant,b.variantId), b=>b.batchWeight||0);

  // Section 2 — shift based
  // NOTE: Section 2A specifically uses Excellent + Good + Project (everything
  // except Reject), per an explicit request. This is a locally-scoped
  // calculation — it does NOT change the shared "goodOutputKg" used by the
  // Shift Log table, the shift detail popup, or the Section 3 daily chart,
  // which all still mean Excellent + Good only.
  const outputByVariant = groupSum(shiftList, s=>variantName(plant,s.variantId), s=>{
    const bagWeight = shiftMetrics(s,plant).bagWeight;
    return ((s.excellentBags||0)+(s.goodBags||0)+(s.projectBags||0))*bagWeight;
  });
  const feedrateByVariant = groupAvg(shiftList, s=>variantName(plant,s.variantId), s=>s.feedrateTonHr||0);
  const targetFeedrateByVariant = (()=>{
    const sums={}, counts={};
    shiftList.forEach(s=>{
      const ict = (plant.ict||{})[s.lineId+'_'+s.variantId] || 0;
      if(ict<=0) return;
      const tf = (3600/ict)/1000; // ton/hr, derived from Ideal Cycle Time
      const key = variantName(plant,s.variantId);
      sums[key]=(sums[key]||0)+tf; counts[key]=(counts[key]||0)+1;
    });
    const out={}; Object.keys(sums).forEach(k=>out[k]=sums[k]/counts[k]);
    return out;
  })();
  const allIssues = [];
  shiftList.forEach(s=>(s.quality||[]).forEach(q=>allIssues.push({...q,date:s.date,shift:s.shiftLabel,line:lineName(plant,s.lineId),variant:variantName(plant,s.variantId),shiftId:s.id})));
  const totalRejected = metrics.reduce((a,x)=>a+x.m.rejectKg,0);
  const totalOutputAll = metrics.reduce((a,x)=>a+x.m.totalOutputKg,0);
  const rejectByVariant = groupSum(metrics, x=>variantName(plant,x.s.variantId), x=>x.m.rejectKg);

  // Section 3 — per line
  const linesInScope = lineFilter==='all' ? plant.lines : plant.lines.filter(l=>l.id===lineFilter);
  const linePerf = [];
  linesInScope.forEach(l=>{
    const lm = metrics.filter(x=>x.s.lineId===l.id);
    if(!lm.length) return;
    const variantIdsUsed = [...new Set(lm.map(x=>x.s.variantId))];
    variantIdsUsed.forEach(vid=>{
      const vm = lm.filter(x=>x.s.variantId===vid);
      if(!vm.length) return;
      const variant = variantObj(plant, vid);
      const targetSme = (plant.targetSme||{})[l.id+'_'+vid] || 0;
      linePerf.push({
        line:l, variant, count:vm.length,
        availability: avg(vm.map(x=>x.m.availability)), performance: avg(vm.map(x=>x.m.performance)),
        quality: avg(vm.map(x=>x.m.qualityRate)), oee: avg(vm.map(x=>x.m.oee)),
        sme: avg(vm.filter(x=>x.m.sme>0).map(x=>x.m.sme)),
        targetSme
      });
    });
  });

  // Daily good output chart (supports both monthly and weekly period types)
  const dayTotals={};
  metrics.forEach(x=>{ dayTotals[x.s.date]=(dayTotals[x.s.date]||0)+x.m.goodOutputKg; });
  const maxDay = Math.max(...Object.values(dayTotals),1);
  const chartDays = [];
  if(periodType==='weekly'){
    const dd = new Date(start+'T00:00:00');
    for(let i=0;i<7;i++){ chartDays.push(localDateStr(dd)); dd.setDate(dd.getDate()+1); }
  } else {
    const daysInMonth = new Date(parseInt(ym.slice(0,4)),parseInt(ym.slice(5,7)),0).getDate();
    for(let d=1; d<=daysInMonth; d++) chartDays.push(`${ym}-${String(d).padStart(2,'0')}`);
  }
  let bars='',labels='';
  chartDays.forEach(ds=>{
    const v=dayTotals[ds]||0;
    const dayNum = parseInt(ds.slice(8,10));
    const showLabel = periodType==='weekly' ? true : (dayNum%5===0||dayNum===1);
    bars += `<div class="bar" style="flex:1 1 0;min-width:0;background:${v>0?'var(--amber)':'var(--amber-dim)'};border-radius:2px 2px 0 0;height:${v>0?Math.max(4,(v/maxDay)*140):0}px" title="${ds}: ${fmt(v)} kg"></div>`;
    labels += `<span style="flex:1 1 0;min-width:0;text-align:center;font-size:8.5px;color:var(--text-dim2);font-family:'JetBrains Mono';overflow:hidden;">${showLabel?dayNum:''}</span>`;
  });

  // Section 4 — dies (tallied per Die ID; same Die ID always adds to its lifetime total)
  let dieList = [...diesCache];
  if(lineFilter!=='all') dieList = dieList.filter(d=>d.lineId===lineFilter);
  const dieSums = dieSummaries(dieList);
  const retiredDies = dieSums.filter(s=>s.retired);
  const avgLifeHours = retiredDies.length ? avg(retiredDies.map(s=>s.totalRunningHours)) : 0;
  const avgLifeTons = retiredDies.length ? avg(retiredDies.map(s=>s.totalThroughputTons)) : 0;

  // Group shifts by Line -> Variant for sections 2B, 2C, 2D — each line/variant
  // combination gets its own feedrate, quality issues, and corrective actions,
  // instead of blending different variants (or lines) together.
  const lineVariantGroups = linesInScope.map(l=>{
    const lm = metrics.filter(x=>x.s.lineId===l.id);
    if(!lm.length) return null;
    const variantIdsUsed = [...new Set(lm.map(x=>x.s.variantId))];
    const variantRows = variantIdsUsed.map(vid=>{
      const vm = lm.filter(x=>x.s.variantId===vid);
      if(!vm.length) return null;
      const variant = variantObj(plant, vid);
      const avgActualFeedrate = avg(vm.map(x=>x.s.feedrateTonHr||0));
      const ict = (plant.ict||{})[l.id+'_'+vid] || 0;
      const targetFeedrate = ict>0 ? ((3600/ict)/1000) : 0;
      const issuesHere = allIssues.filter(q=>vm.some(x=>x.s.id===q.shiftId));
      const issueBagTotals = {};
      issuesHere.forEach(q=>{ issueBagTotals[q.issue] = (issueBagTotals[q.issue]||0) + (q.qtyBags||0); });
      const issueBars = {};
      QUALITY_ISSUE_OPTIONS.forEach(opt=>{ if(issueBagTotals[opt]!=null) issueBars[opt]=issueBagTotals[opt]; });
      return {variant, count:vm.length, avgActualFeedrate, targetFeedrate, issuesHere, issueBars};
    }).filter(Boolean);
    return variantRows.length ? {line:l, variantRows} : null;
  }).filter(Boolean);

  body.innerHTML = `
    <div class="panel">
      <h3 style="font-size:15px;margin-bottom:12px;"><span class="section-num">1.</span>Batch Performance Summary</h3>
      <div class="panel-title">A. Batch Production Yield Analysis</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Total Batch Weight</div><div class="value">${fmt(totalBatchWeight)}</div><div class="sub">kg</div></div>
        <div class="stat-card"><div class="label">Total Yield Weight</div><div class="value">${fmt(totalYieldWeight)}</div><div class="sub">kg</div></div>
        <div class="stat-card"><div class="label">Overall Yield</div><div class="value accent">${overallYield.toFixed(1)}%</div><div class="sub">yield ÷ batch weight</div></div>
        <div class="stat-card"><div class="label">Batches Logged</div><div class="value">${batchList.length}</div><div class="sub">${esc(label)}</div></div>
      </div>
      <div class="panel-title" style="margin-top:16px;">B. Raw Material Consumption by Variant (batch weight)</div>
      ${hbarTable(rawByVariant,'kg')}
    </div>

    <div class="panel">
      <h3 style="font-size:15px;margin-bottom:12px;"><span class="section-num">2.</span>Finished Product Performance Review</h3>
      <div class="panel-title">A. Production Output by Variant (kg finished output)</div>
      <div class="calc-note" style="margin-bottom:8px;">Finished output = (Excellent + Good + Project) × Finished Product Weight per bag.</div>
      ${hbarTable(outputByVariant,'kg')}

      <div class="panel-title" style="margin-top:16px;">B. Average Production Feedrate by Line + Variant (ton/hr)</div>
      ${lineVariantGroups.length ? lineVariantGroups.map(g=>`
        <div class="sub-block" style="margin-top:10px;">
          <div style="font-size:11px;color:var(--amber);font-family:'JetBrains Mono';margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;">${esc(g.line.name)} — ${esc(g.line.type)}</div>
          <table>
            <thead><tr><th>Variant</th><th class="num">Avg Actual (t/hr)</th><th class="num">Target (t/hr)</th><th class="num">vs Target</th></tr></thead>
            <tbody>${g.variantRows.map(v=>{
              const diffPct = v.targetFeedrate>0 ? ((v.avgActualFeedrate-v.targetFeedrate)/v.targetFeedrate*100) : null;
              const diffLabel = diffPct==null ? 'target not set' : (diffPct>=0?'+':'')+diffPct.toFixed(1)+'%';
              const diffCls = diffPct==null ? 'badge-dim' : (diffPct>=0?'badge-good':'badge-bad');
              return `<tr><td>${v.variant?esc(v.variant.name):'—'}</td><td class="num">${v.avgActualFeedrate.toFixed(2)}</td><td class="num">${v.targetFeedrate>0?v.targetFeedrate.toFixed(2):'—'}</td><td class="num"><span class="badge ${diffCls}">${diffLabel}</span></td></tr>`;
            }).join('')}</tbody>
          </table>
        </div>`).join('') : `<div class="no-data">No data available.</div>`}
      <div class="calc-note">Target Feedrate (ton/hr) = 3,600 ÷ Ideal Cycle Time (s/kg) ÷ 1,000, specific to each Line + Variant combination.</div>

      <div class="panel-title" style="margin-top:16px;">C. Quality Issues &amp; Root Cause Analysis — by Line + Variant</div>
      ${lineVariantGroups.length ? lineVariantGroups.map(g=>`
        <div class="sub-block" style="margin-top:10px;">
          <div style="font-size:11px;color:var(--amber);font-family:'JetBrains Mono';margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;">${esc(g.line.name)} — ${esc(g.line.type)}</div>
          ${g.variantRows.map(v=>{
            const detailId = 'qdetail_'+uid('');
            return `
            <div style="margin-bottom:12px;">
              <div onclick="toggleQualityDetail('${detailId}', this)" style="cursor:pointer;font-size:10.5px;color:var(--text-dim);font-family:'JetBrains Mono';margin-bottom:4px;display:flex;align-items:center;gap:6px;">
                <span class="qdetail-caret" style="display:inline-block;transition:transform 0.15s;">▶</span>${v.variant?esc(v.variant.name):'—'}
                <span style="color:var(--text-dim2);font-weight:normal;">(click to view logged entries)</span>
              </div>
              ${Object.keys(v.issueBars).length ? hbarTable(v.issueBars,'bags') : `<div class="no-data">No issues logged.</div>`}
              <div id="${detailId}" style="display:none;margin-top:8px;">
                <table><thead><tr><th>Date</th><th>Shift</th><th>Issue</th><th class="num">Qty (bags)</th><th class="num">Qty (kg)</th><th>Root Cause</th></tr></thead>
                <tbody>${v.issuesHere.length ? v.issuesHere.map(q=>`<tr><td>${q.date}</td><td>${q.shift}</td><td>${esc(q.issue)}</td><td class="num">${q.qtyBags!=null?fmt(q.qtyBags):'—'}</td><td class="num">${fmt(q.qtyKg!=null?q.qtyKg:(q.qty||0))}</td><td>${esc(q.rootCause)}</td></tr>`).join('') : `<tr><td colspan="6" class="no-data">No issues logged.</td></tr>`}</tbody>
                </table>
              </div>
            </div>`;
          }).join('')}
        </div>`).join('') : `<div class="no-data">No data available.</div>`}

      <div class="panel-title" style="margin-top:16px;">D. Corrective Actions and Effectiveness — by Line + Variant</div>
      <div class="calc-note" style="margin-bottom:8px;">Rows not yet "Effective", or with follow-up history, are clickable — click one to jump to that shift's log entry.</div>
      ${lineVariantGroups.length ? lineVariantGroups.map(g=>`
        <div class="sub-block" style="margin-top:10px;">
          <div style="font-size:11px;color:var(--amber);font-family:'JetBrains Mono';margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;">${esc(g.line.name)} — ${esc(g.line.type)}</div>
          ${g.variantRows.map(v=>`
            <div style="margin-bottom:12px;">
              <div style="font-size:10.5px;color:var(--text-dim);font-family:'JetBrains Mono';margin-bottom:4px;">${v.variant?esc(v.variant.name):'—'}</div>
              <table><thead><tr><th>Date</th><th>Issue</th><th>Corrective Action</th><th>Effectiveness</th></tr></thead>
                <tbody>${v.issuesHere.length ? v.issuesHere.map(q=>{
                  const shiftForIssue = shiftsCache.find(x=>x.id===q.shiftId);
                  const followUps = (shiftForIssue && shiftForIssue.followUps) || [];
                  const latestFollowUp = followUps.length ? followUps[followUps.length-1] : null;
                  const needsClick = q.effectiveness!=='Effective' || followUps.length>0;
                  const rowAttrs = needsClick ? `class="clickable" onclick="jumpToShiftFromReport('${q.shiftId}')" title="Click to open this shift"` : '';
                  const badgeFor = eff => `<span class="badge ${eff==='Effective'?'badge-good':eff==='Partially Effective'?'badge-mid':eff==='Not Effective'?'badge-bad':'badge-dim'}">${eff}</span>`;
                  const effDisplay = badgeFor(q.effectiveness) + (latestFollowUp ? ' → ' + badgeFor(latestFollowUp.effectiveness) : '');
                  return `<tr ${rowAttrs}><td>${q.date}</td><td>${esc(q.issue)}</td><td>${esc(q.action)}</td><td>${effDisplay}</td></tr>`;
                }).join('') : `<tr><td colspan="4" class="no-data">No corrective actions logged.</td></tr>`}</tbody>
              </table>
            </div>`).join('')}
        </div>`).join('') : `<div class="no-data">No data available.</div>`}
      <div class="panel-title" style="margin-top:16px;">E. Total Finished Product Rejections</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Total Rejected</div><div class="value" style="color:var(--bad)">${fmt(totalRejected)}</div><div class="sub">kg this month</div></div>
        <div class="stat-card"><div class="label">Rejection Rate</div><div class="value">${totalOutputAll>0?(totalRejected/totalOutputAll*100).toFixed(1):'0'}%</div><div class="sub">of total output</div></div>
      </div>
      ${hbarTable(rejectByVariant,'kg')}
    </div>

    <div class="panel">
      <h3 style="font-size:15px;margin-bottom:12px;"><span class="section-num">3.</span>Line Performance and Efficiency Analysis</h3>
      <div class="panel-title">Daily Good Output — Scoped Lines</div>
      <div style="display:flex;align-items:flex-end;gap:3px;height:150px;border-bottom:1px solid var(--line);">${bars}</div>
      <div style="display:flex;gap:3px;margin-top:5px;">${labels}</div>
      ${linePerf.length ? linePerf.map(lp=>{
        const oc = oeeClass(lp.oee);
        const smeDiff = lp.targetSme>0 ? (lp.sme - lp.targetSme) : null;
        const smeStatus = smeDiff==null ? '' : (smeDiff<=0 ? '<span class="badge badge-good">At/under target</span>' : '<span class="badge badge-bad">Over target</span>');
        return `<div class="sub-block" style="margin-top:16px;">
          <div style="font-size:12px;color:var(--text);font-family:'JetBrains Mono';margin-bottom:8px;">${esc(lp.line.name)} — ${esc(lp.line.type)} · ${lp.variant?esc(lp.variant.name):'Unassigned'} <span style="color:var(--text-dim2);">(${lp.count} shifts)</span></div>
          <div class="stat-grid" style="grid-template-columns:repeat(2,200px);margin-bottom:10px;">
            <div class="stat-card"><div class="label">Avg SME</div><div class="value accent">${lp.sme>0?lp.sme.toFixed(2):'—'}</div><div class="sub">kWh / ton</div></div>
            <div class="stat-card"><div class="label">Target SME</div><div class="value">${lp.targetSme>0?lp.targetSme.toFixed(2):'—'}</div><div class="sub">${smeStatus||'not set'}</div></div>
          </div>
          <div class="gauge-row">
            ${gaugeCard('Availability', lp.availability)}
            ${gaugeCard('Performance', lp.performance)}
            ${gaugeCard('Quality Rate', lp.quality)}
            ${gaugeCard('OEE', lp.oee)}
          </div>
          <div style="margin-top:8px;text-align:center;"><span class="badge ${oc.cls}">${oc.label} (${lp.oee.toFixed(1)}%)</span></div>
        </div>`;
      }).join('') : `<div class="no-data">No line data for this scope.</div>`}
      <div class="calc-note" style="margin-top:12px;">OEE bands: ≥85% World Class · 70–84% Good · 60–69% Average · &lt;60% Bad.</div>
    </div>

    <div class="panel">
      <h3 style="font-size:15px;margin-bottom:12px;"><span class="section-num">4.</span>Die Performance and Service Life Analysis</h3>
      <div class="stat-grid" style="margin-bottom:14px;">
        <div class="stat-card"><div class="label">Avg Service Life</div><div class="value accent">${avgLifeHours?fmt(avgLifeHours,1):'—'}</div><div class="sub">hours (worn out dies, lifetime total)</div></div>
        <div class="stat-card"><div class="label">Avg Throughput Life</div><div class="value">${avgLifeTons?fmt(avgLifeTons,1):'—'}</div><div class="sub">tons before retirement</div></div>
        <div class="stat-card"><div class="label">Dies On Record</div><div class="value">${dieSums.length}</div><div class="sub">unique die IDs</div></div>
        <div class="stat-card"><div class="label">Currently Active</div><div class="value">${dieSums.filter(s=>!s.retired).length}</div><div class="sub">in service</div></div>
      </div>
      <table><thead><tr><th>Die ID</th><th>Status</th><th>Last Line</th><th class="num">Entries</th><th class="num">Total Running Hrs</th><th class="num">Total Throughput (t)</th><th>Last Logged</th></tr></thead>
        <tbody>${dieSums.length ? dieSums.map(s=>`<tr><td>${esc(s.dieId)}</td><td>${s.retired?'<span class="badge badge-dim">Worn Out</span>':'<span class="badge badge-info">Still Active</span>'}</td><td>${s.latest?esc(lineName(plant,s.latest.lineId)):'—'}</td><td class="num">${s.entryCount}</td><td class="num">${fmt(s.totalRunningHours,1)}</td><td class="num">${fmt(s.totalThroughputTons,1)}</td><td>${s.latest?dieEntryDate(s.latest):'—'}</td></tr>`).join('') : `<tr><td colspan="7" class="no-data">No die records yet.</td></tr>`}</tbody>
      </table>
    </div>`;
}
</script>
</body>
</html>
